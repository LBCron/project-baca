# ==============================================================================
# Project Baca — production compose (staging/prod).
# Usage: cp .env.production.example .env.production
#        make prod-pull prod-up      (release images, ROTARIA_VERSION)
#        make prod-build prod-up     (images built from this checkout)
# Dev stack stays in docker-compose.yml (host ports 5433/6380/9005/9006).
# ==============================================================================

# The default json-file driver never rotates, so a small VPS disk fills up.
x-logging: &logging
  driver: local

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    restart: always
    logging: *logging
    environment:
      POSTGRES_USER: baca_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: project_baca_db
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baca_user -d project_baca_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off migration runner (make prod-migrate): the migrations and the
  # runner of the checked-out tag, mounted read-only.
  migrate:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    profiles: ["ops"]
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /work
    entrypoint: ["bash", "scripts/migrate.sh"]
    command: ["up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://baca_user:${POSTGRES_PASSWORD}@postgres:5432/project_baca_db
    volumes:
      - ./migrations:/work/migrations:ro
      - ./scripts/migrate.sh:/work/scripts/migrate.sh:ro

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: always
    logging: *logging
    # Refresh tokens and sessions live here; RDB alone loses the minutes
    # since the last snapshot on a restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bundled store for a host without R2 (`--profile minio`, with
  # S3_ENDPOINT=http://minio:9000).
  minio:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio:latest@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    restart: always
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3 keys}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3 keys}
    volumes:
      - miniodata_prod:/data

  server:
    image: ghcr.io/aprxty3/project-baca/server:${ROTARIA_VERSION:?set ROTARIA_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: always
    # Compose sends SIGKILL after the grace period (10 s by default); Axum
    # drains in-flight requests, so a 50 MB admin upload gets 30 s.
    stop_grace_period: 30s
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8080
      LOG_FORMAT: json
      RUST_LOG: warn
      # The site, plus the Tauri app WebView (tauri:// on desktop, http://tauri.localhost on Android and Windows).
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN},tauri://localhost,http://tauri.localhost
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-x-forwarded-for}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-600}
      BOOK_SEARCH_RATE_LIMIT_PER_MINUTE: ${BOOK_SEARCH_RATE_LIMIT_PER_MINUTE:-30}
      OTP_HOURLY_BUDGET: ${OTP_HOURLY_BUDGET:-100}
      AI_DAILY_BUDGET: ${AI_DAILY_BUDGET:-5000}
      JWT_SECRET: ${JWT_SECRET:?set a 32+ char secret}
      JWT_ACCESS_EXPIRY_MINUTES: 60
      JWT_REFRESH_EXPIRY_DAYS: 14
      DATABASE_URL: postgres://baca_user:${POSTGRES_PASSWORD}@postgres:5432/project_baca_db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3 keys}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3 keys}
      S3_BUCKET_EPUBS: ${S3_BUCKET_EPUBS:-baca-epubs}
      S3_BUCKET_COVERS: ${S3_BUCKET_COVERS:-baca-covers}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SMTP_HOST: ${SMTP_HOST:?set SMTP}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?set SMTP}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Project Baca}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set Gemini key}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-gemini-embedding-2}
      EMBEDDING_DIMENSION: 768
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q '\"status\":\"healthy\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ghcr.io/aprxty3/project-baca/worker:${ROTARIA_VERSION:?set ROTARIA_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    stop_grace_period: 30s
    logging: *logging
    # tini as PID 1 forwards SIGTERM to the worker, which releases its job.
    init: true
    # A runaway parse is killed inside its own cgroup, never Postgres by the
    # host OOM killer; the largest real book peaks near 100 MB.
    mem_limit: 768m
    memswap_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://baca_user:${POSTGRES_PASSWORD}@postgres:5432/project_baca_db
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3 keys}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3 keys}
      S3_BUCKET_EPUBS: ${S3_BUCKET_EPUBS:-baca-epubs}
      S3_BUCKET_COVERS: ${S3_BUCKET_COVERS:-baca-covers}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set Gemini key}

  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
      args:
        API_BASE_URL: ${API_BASE_URL:-/api/v1}
    restart: always
    logging: *logging
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata_prod:
  redisdata_prod:
  miniodata_prod:
  caddy_data:
  caddy_config:
