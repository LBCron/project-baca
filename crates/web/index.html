<body>
    <div id="root"></div>
    <!-- Painted before the WASM arrives on the home page, with the app's own
         classes so the phone heading sits where the app draws it; the app
         removes it on mount. Shown by boot.js, one language by the lang it
         sets. The wide hero is left out: it centres against the plate and the
         search row, so a static copy would land in the wrong place. -->
    <div class="shell" id="boot-shell" aria-hidden="true">
        <header class="site-header">
            <div class="container site-header-inner">
                <span class="brand-title">
                    <svg class="brand-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M6 22 24 9l18 13"/><path d="M11 22v17M37 22v17M11 22h26"/><circle cx="24" cy="31" r="8.5" stroke-width="2.4"/><path d="M24 22.5v17M15.5 31h17M18 25l12 12M30 25 18 37" stroke-width="1.9"/><path d="M4 44c3.3-2.4 6.7-2.4 10 0s6.7 2.4 10 0 6.7-2.4 10 0 6.7 2.4 10 0" stroke-width="2.2"/><circle cx="24" cy="31" r="2.8" fill="var(--accent)" stroke="none"/></svg>
                    <span>Rotaria</span>
                </span>
            </div>
        </header>
        <main class="shell-main">
            <div class="container">
                <section class="hero">
                    <div class="hero-copy">
                        <div class="greeting narrow-only">
                            <span class="greeting-time">&nbsp;</span>
                            <h1 class="display hero-heading"><span lang="id">Mau membaca <em>apa hari ini?</em></span><span lang="en">What shall we <em>read today?</em></span></h1>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>
