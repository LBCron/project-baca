# Weekly version updates against develop; minor and patch bumps arrive as
# one pull request per ecosystem, and a release must be 7 days old first
# (zizmor's floor for the cooldown).
version: 2

updates:
  - package-ecosystem: cargo
    directories: ["/", "/apps/tauri"]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # sea-orm 2 needs sqlx 0.9, which pgvector does not support yet.
    ignore:
      - dependency-name: sea-orm
        update-types: ["version-update:semver-major"]
    groups:
      # leptos, its router, and meta share one reactive runtime; a lone bump
      # links two runtimes into the bundle.
      leptos:
        patterns: ["leptos", "leptos_*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /python_worker
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
