name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TRUNK_VERSION: v0.22.1

jobs:
  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Findings print to the job log, so the gate needs neither code
      # scanning nor a public repository.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: medium
          version: 1.32.0

  check:
    name: Format, lint, native and wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
      - run: make check
      - name: Release version matches the changelog
        run: python3 scripts/release_notes.py --check-version

  backend:
    name: Server and worker tests (live services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: ./.github/actions/dev-stack
      - name: Domain, infra, and server unit tests
        run: |
          make test-domain
          cargo test -p infra --lib
          cargo test -p server --lib
      - name: Server functional suites
        run: cargo test -p server --test it
      - name: Live adversarial auth tests
        run: make test-live
      - name: Load and stress
        run: make test-load-stress
      - name: Worker unit and live tests
        run: make worker-test worker-test-live

  web:
    name: Release bundle and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # scripts/trunk.sha256 is shared with Dockerfile.edge; bump it with TRUNK_VERSION.
      - name: Install Trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          tarball=trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/${tarball}"
          grep -F "  ${tarball}" scripts/trunk.sha256 | sha256sum -c -
          tar -xzf "$tarball" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Release bundle, size budget, no inline script
        run: |
          make build-web WEB_DIST="$PWD/target/web-release"
          python3 scripts/externalize_inline_scripts.py --check target/web-release
      - uses: ./.github/actions/dev-stack
      - name: Browser test environment
        run: |
          uv venv "$HOME/.venvs/webapp-testing"
          uv pip install --python "$HOME/.venvs/webapp-testing/bin/python" -r crates/web/tests/requirements-test.txt
          "$HOME/.venvs/webapp-testing/bin/python" -m playwright install --with-deps chromium
      - name: Start the API and the release bundle
        run: |
          cargo build -p server
          nohup ./target/debug/server > server.log 2>&1 &
          nohup make dev-web-release > trunk.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf http://localhost:8080/health >/dev/null && curl -sf http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 3
          done
          tail -n 40 server.log trunk.log
          exit 1
      # Visual goldens are rendered on the maintainer's machine; font
      # rasterisation differs on the runner, so CI checks behaviour only.
      - name: Web unit, e2e, component, integration, and axe suites
        env:
          PYTEST_ADDOPTS: --screenshot only-on-failure --tracing retain-on-failure --output ${{ github.workspace }}/test-results
        run: |
          make test-web
          cd crates/web/tests && "$HOME/.venvs/webapp-testing/bin/python" -m pytest a11y/ --browser chromium -q
      # The runner's coreutils (uutils) reject the legacy `tail -100` form.
      - name: Logs
        if: failure()
        run: tail -n 100 server.log trunk.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-failures
          path: test-results
          retention-days: 7
