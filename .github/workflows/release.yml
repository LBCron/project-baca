name: Release

# A pushed tag vX.Y.Z publishes the three images to GHCR and a GitHub
# release whose notes are the CHANGELOG section of that version. The tag
# must name the workspace version in Cargo.toml.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  notes:
    name: Version and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  images:
    name: Image ${{ matrix.image }}
    needs: notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: Dockerfile.server
          - image: worker
            dockerfile: Dockerfile.worker
          - image: edge
            dockerfile: Dockerfile.edge
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Rotaria ${{ matrix.image }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    name: GitHub release
    needs: [notes, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      # 0.y.z is initial development under semver, so it ships as a pre-release.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.notes.outputs.version }}
        run: |
          flags=()
          case "$VERSION" in 0.*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Rotaria $VERSION" --notes-file release-notes.md "${flags[@]}"
